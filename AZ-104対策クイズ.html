<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ-104 対策クイズ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: linear-gradient(135deg, #f0f4f9 0%, #e3ecf7 100%);
    color: #1a1a1a;
    min-height: 100vh;
    line-height: 1.6;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
    color: #0a4d8a;
    letter-spacing: 0.02em;
  }
  .progress-wrap {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: #555;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #d8e2ee;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2c7bd1, #4ca5e8);
    transition: width 0.35s ease;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(20, 50, 90, 0.08);
    padding: 28px 26px;
    margin-bottom: 18px;
  }
  .chapter-tag {
    display: inline-block;
    background: #e8f1fb;
    color: #0a4d8a;
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #1a1a1a;
    white-space: pre-wrap;
    margin-bottom: 20px;
  }
  .multi-badge {
    display: inline-block;
    background: #fff3d6;
    color: #8a5a00;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    margin-left: 6px;
    vertical-align: middle;
  }
  .choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border: 2px solid #e1e8f0;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    background: #fafbfd;
  }
  .choice:hover:not(.locked) {
    border-color: #4ca5e8;
    background: #f3f8fd;
  }
  .choice input {
    margin-top: 4px;
    flex-shrink: 0;
    accent-color: #2c7bd1;
    width: 16px;
    height: 16px;
  }
  .choice-key {
    font-weight: 700;
    color: #0a4d8a;
    flex-shrink: 0;
    min-width: 18px;
  }
  .choice-text {
    flex: 1;
    color: #2c2c2c;
  }
  .choice.locked { cursor: default; }
  .choice.correct {
    border-color: #2e9956;
    background: #e8f7ee;
  }
  .choice.incorrect {
    border-color: #d33b3b;
    background: #fbecec;
  }
  .choice.correct .choice-key { color: #2e9956; }
  .choice.incorrect .choice-key { color: #d33b3b; }
  .submit-btn, .next-btn, .primary-btn, .secondary-btn {
    margin-top: 22px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .submit-btn, .primary-btn {
    background: linear-gradient(135deg, #2c7bd1, #1a5ca8);
    color: #fff;
    box-shadow: 0 3px 10px rgba(44, 123, 209, 0.3);
  }
  .submit-btn:hover:not(:disabled), .primary-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(44, 123, 209, 0.4);
  }
  .submit-btn:disabled {
    background: #c0ccd9;
    cursor: not-allowed;
    box-shadow: none;
  }
  .next-btn {
    background: #2e9956;
    color: #fff;
    box-shadow: 0 3px 10px rgba(46, 153, 86, 0.3);
  }
  .next-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(46, 153, 86, 0.4);
  }
  .secondary-btn {
    background: #fff;
    color: #0a4d8a;
    border: 2px solid #0a4d8a;
  }
  .secondary-btn:hover {
    background: #f0f6fc;
  }
  .feedback {
    margin-top: 22px;
    padding: 18px 20px;
    border-radius: 10px;
    border-left: 5px solid;
  }
  .feedback.correct {
    background: #e8f7ee;
    border-color: #2e9956;
  }
  .feedback.incorrect {
    background: #fbecec;
    border-color: #d33b3b;
  }
  .feedback-title {
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 1rem;
  }
  .feedback.correct .feedback-title { color: #2e9956; }
  .feedback.incorrect .feedback-title { color: #d33b3b; }
  .feedback-answer {
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
  }
  .feedback-explanation {
    color: #333;
    font-size: 0.95rem;
    line-height: 1.7;
  }
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  /* Summary page */
  .summary-score {
    text-align: center;
    padding: 30px 20px 26px;
  }
  .score-percent {
    font-size: 4rem;
    font-weight: 800;
    line-height: 1;
    background: linear-gradient(135deg, #2c7bd1, #1a5ca8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .score-detail {
    color: #555;
    font-size: 1rem;
    margin-bottom: 22px;
  }
  .summary-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .wrong-section h2 {
    margin: 30px 0 14px;
    font-size: 1.1rem;
    color: #0a4d8a;
    border-bottom: 2px solid #d8e2ee;
    padding-bottom: 8px;
  }
  .wrong-item {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(20, 50, 90, 0.06);
    border-left: 4px solid #d33b3b;
  }
  .wrong-q-meta {
    font-size: 0.78rem;
    color: #888;
    margin-bottom: 6px;
  }
  .wrong-q-text {
    font-weight: 600;
    margin-bottom: 12px;
    white-space: pre-wrap;
    font-size: 0.95rem;
  }
  .wrong-choice {
    padding: 6px 10px;
    margin: 4px 0;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .wrong-choice.correct {
    background: #e8f7ee;
    color: #1b6a3b;
  }
  .wrong-choice.user-wrong {
    background: #fbecec;
    color: #8a2828;
    text-decoration: line-through;
  }
  .wrong-choice.normal {
    color: #555;
  }
  .wrong-answers-line {
    font-size: 0.88rem;
    margin: 8px 0 10px;
    color: #555;
  }
  .wrong-answers-line strong { color: #2e9956; }
  .wrong-user-line { color: #d33b3b; }
  .wrong-explanation {
    margin-top: 10px;
    padding: 10px 12px;
    background: #f7f9fc;
    border-radius: 8px;
    font-size: 0.88rem;
    color: #333;
    line-height: 1.6;
  }
  .empty-wrong {
    text-align: center;
    padding: 30px;
    color: #2e9956;
    font-weight: 600;
  }
  @media (max-width: 600px) {
    .container { padding: 16px 14px 60px; }
    .card { padding: 22px 18px; }
    .score-percent { font-size: 3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
